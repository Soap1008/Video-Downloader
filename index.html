<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guowa Pobieracz</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="theme-color" content="#0f172a">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-4 font-sans antialiased">
    
    <div class="max-w-md w-full mx-auto mt-8 bg-slate-800/90 backdrop-blur rounded-2xl shadow-2xl p-6 border border-slate-700/60">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600/20 text-blue-400 mb-3 border border-blue-500/30">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Guowa Pobieracz</h1>
            <p class="text-sm text-slate-400 mt-1">Wklej link z TikToka, Twittera lub YouTube</p>
        </div>

        <form id="downloadForm" class="space-y-4">
            <div>
                <input type="url" id="urlInput" placeholder="https://..." required
                    class="w-full px-4 py-3.5 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-base">
            </div>
            <button type="submit" id="submitBtn"
                class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold rounded-xl shadow-lg shadow-blue-600/20 transition duration-200 flex items-center justify-center space-x-2 text-base">
                <span>Pobierz wideo</span>
            </button>
        </form>

        <div id="status" class="mt-4 text-center text-sm font-medium hidden p-3 rounded-xl border"></div>
    </div>

    <footer class="text-center text-xs text-slate-500 py-4">
        PWA &bull; Automatyczne czyszczenie co 24h
    </footer>

    <script>
        const form = document.getElementById('downloadForm');
        const urlInput = document.getElementById('urlInput');
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = urlInput.value.trim();
            if (!url) return;

            // Blokujemy formularz i pokazujemy stan ładowania
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            statusDiv.className = "mt-4 text-center text-sm font-medium p-3 rounded-xl border bg-blue-950/40 border-blue-800/50 text-blue-300";
            statusDiv.textContent = 'Trwa pobieranie i konwersja (FFmpeg)... To może chwilę potrwać.';
            statusDiv.classList.remove('hidden');

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || 'Wystąpił błąd podczas pobierania');
                }

                // Odbieranie pliku jako strumień binarny
                const blob = await response.blob();
                
                // Pobieramy nazwę pliku z nagłówka serwera
                const contentDisposition = response.headers.get('content-disposition');
                let filename = 'video.mp4';
                if (contentDisposition && contentDisposition.includes('filename=')) {
                    filename = contentDisposition.split('filename=')[1].replace(/["']/g, '');
                }

                // Automatyczne wywołanie zapisu pliku na urządzeniu mobilnym
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);

                statusDiv.className = "mt-4 text-center text-sm font-medium p-3 rounded-xl border bg-emerald-950/40 border-emerald-800/50 text-emerald-300";
                statusDiv.textContent = 'Sukces! Plik został pobrany na Twoje urządzenie.';
                urlInput.value = '';
            } catch (err) {
                statusDiv.className = "mt-4 text-center text-sm font-medium p-3 rounded-xl border bg-rose-950/40 border-rose-800/50 text-rose-300";
                statusDiv.textContent = 'Błąd: ' + err.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });

        // Rejestracja Service Workera dla trybu PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .catch(err => console.log("Błąd Service Workera:", err));
            });
        }
    </script>
</body>
</html>
