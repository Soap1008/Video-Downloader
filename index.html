<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Downloader</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="theme-color" content="#0f172a">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-4 font-sans antialiased">
    
    <div class="max-w-md w-full mx-auto mt-8 bg-slate-800/90 backdrop-blur rounded-2xl shadow-2xl p-6 border border-slate-700/60">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600/20 mb-3 border border-blue-500/30 overflow-hidden">
                <img src="/ikona.png" alt="Logo" class="w-full h-full object-cover">
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Video Downloader</h1>
            <p class="text-sm text-slate-400 mt-1">Wklej link z TikToka lub YouTube</p>
        </div>

        <form id="downloadForm" class="space-y-4">
            <div>
                <input type="url" id="urlInput" placeholder="https://..." required
                    class="w-full px-4 py-3.5 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-base">
            </div>
            <button type="submit" id="submitBtn"
                class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold rounded-xl shadow-lg shadow-blue-600/20 transition duration-200 flex items-center justify-center space-x-2 text-base">
                <span>Pobierz wideo</span>
            </button>
        </form>

        <!-- Pasek postępu -->
        <div id="progressContainer" class="mt-5 hidden space-y-2">
            <div class="flex justify-between text-xs font-medium text-slate-300">
                <span id="progressText">Pobieranie i konwersja...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="w-full bg-slate-900 rounded-full h-2.5 overflow-hidden border border-slate-700/50">
                <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300 ease-out" style="width: 0%"></div>
            </div>
        </div>

        <div id="status" class="mt-4 text-center text-sm font-medium hidden p-3 rounded-xl border"></div>
    </div>

    <footer class="text-center text-xs text-slate-500 py-4">
        PWA &bull; Automatyczne czyszczenie co 24h
    </footer>

    <script>
        const form = document.getElementById('downloadForm');
        const urlInput = document.getElementById('urlInput');
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const progressText = document.getElementById('progressText');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = urlInput.value.trim();
            if (!url) return;

            // Blokujemy formularz i pokazujemy pasek postępu
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            statusDiv.classList.add('hidden');
            progressContainer.classList.remove('hidden');

            let progress = 0;
            progressBar.style.width = '0%';
            progressPercent.textContent = '0%';
            progressText.textContent = 'Łączenie z serwerem...';

            // Symulacja płynnego postępu do 90% w trakcie oczekiwania na serwer
            const progressInterval = setInterval(() => {
                if (progress < 90) {
                    // Im wyżej, tym wolniej rośnie, żeby nie dobić do 100% przedwcześnie
                    const increment = (90 - progress) * 0.1;
                    progress = Math.min(90, progress + Math.max(increment, 0.5));
                    
                    const rounded = Math.round(progress);
                    progressBar.style.width = rounded + '%';
                    progressPercent.textContent = rounded + '%';

                    if (rounded > 30 && rounded < 70) {
                        progressText.textContent = 'Pobieranie pliku wideo...';
                    } else if (rounded >= 70) {
                        progressText.textContent = 'Konwersja FFmpeg (magia w tle)...';
                    }
                }
            }, 400);

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                clearInterval(progressInterval);

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || 'Wystąpił błąd podczas pobierania');
                }

                // Sukces! Dobijamy pasek do 100%
                progressBar.style.width = '100%';
                progressPercent.textContent = '100%完毕'; // lub po prostu 100%
                progressPercent.textContent = '100%';
                progressText.textContent = 'Gotowe! Zapisywanie pliku...';

                // Odbieranie pliku jako strumień binarny
                const blob = await response.blob();
                
                const contentDisposition = response.headers.get('content-disposition');
                let filename = 'video.mp4';
                if (contentDisposition && contentDisposition.includes('filename=')) {
                    filename = contentDisposition.split('filename=')[1].replace(/["']/g, '');
                }

                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);

                setTimeout(() => {
                    progressContainer.classList.add('hidden');
                    statusDiv.className = "mt-4 text-center text-sm font-medium p-3 rounded-xl border bg-emerald-950/40 border-emerald-800/50 text-emerald-300";
                    statusDiv.textContent = 'Sukces! Plik został pobrany na Twoje urządzenie.';
                    statusDiv.classList.remove('hidden');
                }, 800);

                urlInput.value = '';
            } catch (err) {
                clearInterval(progressInterval);
                progressContainer.classList.add('hidden');
                statusDiv.className = "mt-4 text-center text-sm font-medium p-3 rounded-xl border bg-rose-950/40 border-rose-800/50 text-rose-300";
                statusDiv.textContent = 'Błąd: ' + err.message;
                statusDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .catch(err => console.log("Błąd Service Workera:", err));
            });
        }
    </script>
</body>
</html>
